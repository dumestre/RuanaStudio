[workspace]
resolver = "3"
members = [
    "app",
    "crates/daw-core",
    "crates/daw-audio",
    "crates/daw-media",
    "crates/daw-midi",
    "crates/daw-plugins",
    "crates/daw-project",
    "timeline-render",
    "ruana-hub",
]
exclude = ["vendor/bindgen-syn2"]

# -----------------------------------------------------------------
# WORKAROUND DE DEPENDÊNCIA (remover quando o bindgen suportar syn 3)
#
# Slint 1.19 -> skia-bindings 0.157 -> bindgen 0.73.2. O bindgen
# declara `syn >=2, <4` mas não compila com syn 3 (que a Slint 1.19
# exige). O shim em `vendor/bindgen-syn2` reexporta o bindgen 0.72.1
# (syn 2) com a versão que o skia-bindings pede.
# -----------------------------------------------------------------
[patch.crates-io]
bindgen = { path = "vendor/bindgen-syn2" }

[workspace.package]
version = "0.6.0"
edition = "2024"

[workspace.dependencies]
slint = "1.18.0"

# =========================================================
# PROFILES
#
# Problema: `cargo build` (dev) era rápido de compilar mas o
# app rodava mal — engine de áudio, decodificação (symphonia)
# e o renderer Skia são código quente que despenca sem
# otimização.
#
# Solução: otimizar as DEPENDÊNCIAS mesmo no dev, mantendo o
# nosso código em debug rápido de compilar e fácil de depurar.
# =========================================================

[profile.dev]
opt-level = 0          # nosso código: compila rápido, debugável
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2          # dependências (skia, symphonia, cpal...): rápidas em runtime

# Crates de áudio do próprio workspace também precisam de
# otimização — são eles que enchem o buffer de som.
[profile.dev.package.daw-audio]
opt-level = 2

[profile.dev.package.daw-media]
opt-level = 2

# Release enxuto e ainda rápido de linkar:
[profile.release]
lto = "thin"
codegen-units = 16
debug = false
